namespace: grpc-hello-service
replicaCount: 1

image:
  repository: "{ACCOUNT_ID}.dkr.ecr.{AWS_REGION}.amazonaws.com/grpc-hello-service"
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080

grpc:
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

instrumentation:
  serviceName: grpc-hello-service
  otlpEndpoint: "http://adot-collector-collector:4317"
  dotnetImage: "public.ecr.aws/aws-observability/adot-autoinstrumentation-dotnet:v1.11.1"

collector:
  mode: deployment
  replicas: 2
  healthCheckPort: 13133
  otlpPort: 4317
  serviceAccount:
    name: adot-collector-collector
    roleArn: "arn:aws:iam::{ACCOUNT_ID}:role/ADOTCollectorRole"
  cloudwatch:
    region: us-west-2
    namespace: GrpcHelloService
  xray:
    region: us-west-2
