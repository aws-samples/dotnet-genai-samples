AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Hotel Reservation Lambda Function

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: dotnet8
    Architectures:
      - x86_64
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: HotelReservationFunction
        POWERTOOLS_LOG_LEVEL: INFO

Resources:
  HotelReservationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/HotelDealsLambda/
      Handler: HotelDealsLambda::HotelDealsLambda.Function::FunctionHandler
      Description: Hotel Reservation Function using AWS Lambda Powertools for .NET
      Role: !GetAtt HotelReservationFunctionRole.Arn

  HotelReservationFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
          - Effect: Allow
            Principal:
              Service:
                - bedrock.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: '*'

  BedrockAgentFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref HotelReservationFunction
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      SourceArn: !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*'

Outputs:
  HotelReservationFunctionArn:
    Description: ARN of the Hotel Reservation Function
    Value: !GetAtt HotelReservationFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-HotelReservationFunctionArn'
  
  HotelReservationFunctionName:
    Description: Name of the Hotel Reservation Function
    Value: !Ref HotelReservationFunction
    Export:
      Name: !Sub '${AWS::StackName}-HotelReservationFunctionName'