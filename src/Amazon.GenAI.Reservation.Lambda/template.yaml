AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Hotel Deals and Reservation Lambda Function

Parameters:
  BedrockAgentId:
    Type: String
    Description: The ID of the Bedrock Agent that will invoke this function
    Default: ""

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: dotnet8
    Architectures:
      - x86_64
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: HotelDealsFunction
        POWERTOOLS_LOG_LEVEL: INFO

Resources:
  HotelBookingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: HotelBookings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: BookingId
          AttributeType: S
      KeySchema:
        - AttributeName: BookingId
          KeyType: HASH

  HotelDealsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/HotelDealsLambda/
      Handler: HotelDealsLambda::HotelDealsLambda.Function::FunctionHandler
      Description: Hotel Deals and Reservation Function using AWS Lambda Powertools for .NET
      Role: !GetAtt HotelDealsFunctionRole.Arn
      Environment:
        Variables:
          HOTEL_BOOKINGS_TABLE: !Ref HotelBookingsTable

  HotelDealsFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
          - Effect: Allow
            Principal:
              Service:
                - bedrock.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: '*'
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt HotelBookingsTable.Arn

  BedrockAgentFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref HotelDealsFunction
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com
      SourceArn: !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*'

Outputs:
  HotelDealsFunctionArn:
    Description: ARN of the Hotel Deals Function
    Value: !GetAtt HotelDealsFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-HotelDealsFunctionArn'
  
  HotelDealsFunctionName:
    Description: Name of the Hotel Deals Function
    Value: !Ref HotelDealsFunction
    Export:
      Name: !Sub '${AWS::StackName}-HotelDealsFunctionName'

  HotelBookingsTableName:
    Description: Name of the DynamoDB table for hotel bookings
    Value: !Ref HotelBookingsTable
    Export:
      Name: !Sub '${AWS::StackName}-HotelBookingsTable'