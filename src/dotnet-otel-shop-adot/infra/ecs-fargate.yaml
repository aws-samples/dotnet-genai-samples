AWSTemplateFormatVersion: "2010-09-09"
Description: >
  .NET observability shop on ECS Fargate (ARM64). shop-web sits behind an ALB that only
  AllowedCidr can reach; shop-api is private and reached through Service Connect. The apps are
  instrumented by the ADOT .NET auto-instrumentation (no telemetry code): the profiler ships
  inside each image and is switched on by environment variables. Each task runs a CloudWatch
  agent sidecar with Application Signals enabled. Apps log JSON to stdout via Serilog, which
  the awslogs driver ships.

Parameters:
  ImageTag:
    Type: String
    Description: Tag of the dotnet-shop/web and dotnet-shop/api images in ECR (see infra/deploy-ecs.sh).
  AllowedCidr:
    Type: String
    Description: Only this CIDR can reach the storefront ALB, e.g. 203.0.113.10/32 (your public IP).
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/(3[0-2]|[12]\d|[89])$
    ConstraintDescription: An IPv4 CIDR with a prefix of /8 or narrower.
  CloudWatchAgentImage:
    Type: String
    Default: public.ecr.aws/cloudwatch-agent/cloudwatch-agent:latest
  # Required storage resources (infra/shop-resources.yaml outputs).
  OrderQueueUrl:
    Type: String
    Description: SQS order queue URL. The API also uses the DynamoDB tables from the same stack.
  ShopApiPolicyArn:
    Type: String
    Description: Managed policy granting the API access to the tables and queue.
  # Required checkout resources (infra/demo-integrations.yaml outputs).
  ReceiptsBucket:
    Type: String
    Description: S3 bucket for order receipts.
  PaymentSecretArn:
    Type: String
    Description: Secrets Manager secret with the payment gateway key.
  IntegrationsPolicyArn:
    Type: String
    Description: Managed policy granting the API access to the bucket and secret.

Rules:
  NotOpenToInternet:
    Assertions:
      - Assert: !Not [!Equals [!Ref AllowedCidr, 0.0.0.0/0]]
        AssertDescription: The storefront must not be open to the whole internet.

Resources:
  # ---------------------------------------------------------------------------
  # Network: 2 public subnets (ALB, NAT) and 2 private subnets (tasks)
  # ---------------------------------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: dotnet-shop }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: dotnet-shop-public-1 }]
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: dotnet-shop-public-2 }]
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: dotnet-shop-private-1 }]
  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: dotnet-shop-private-2 }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnet1Routes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable
  PublicSubnet2Routes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # One NAT gateway keeps cost down; tasks use it to reach ECR, CloudWatch, and X-Ray.
  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet1
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
  PrivateSubnet1Routes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable
  PrivateSubnet2Routes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # ---------------------------------------------------------------------------
  # Security groups: AllowedCidr -> ALB:80 -> web:8080 -> api:8080
  # ---------------------------------------------------------------------------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Storefront ALB, reachable only from AllowedCidr
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedCidr
          Description: Storefront (HTTP) from the allowed CIDR only

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: shop-web tasks, reachable only from the ALB
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: ALB to shop-web

  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: shop-api tasks, reachable only from shop-web
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref WebSecurityGroup
          Description: shop-web to shop-api (Service Connect)

  # ---------------------------------------------------------------------------
  # Load balancer (storefront only)
  # ---------------------------------------------------------------------------
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "15"

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

  # ---------------------------------------------------------------------------
  # Cluster, Service Connect namespace, log groups
  # ---------------------------------------------------------------------------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: dotnet-shop
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      ServiceConnectDefaults:
        Namespace: !GetAtt Namespace.Arn

  Namespace:
    Type: AWS::ServiceDiscovery::HttpNamespace
    Properties:
      Name: shop.local

  WebLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /dotnet-shop/ecs/web
      RetentionInDays: 7
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /dotnet-shop/ecs/api
      RetentionInDays: 7
  AgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /dotnet-shop/ecs/cwagent
      RetentionInDays: 7

  # ---------------------------------------------------------------------------
  # IAM
  # ---------------------------------------------------------------------------
  # Used by ECS to pull images and write container logs.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # Used by the containers. A task role is shared by every container in the task, so this
  # covers the CloudWatch agent sidecar (X-Ray, CloudWatch metrics, and Application Signals
  # writes; CloudWatchAgentServerPolicy includes the Application Signals permissions).
  # The apps themselves need nothing more with in-memory storage.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
        - !Ref IntegrationsPolicyArn
        - !Ref ShopApiPolicyArn

  # ---------------------------------------------------------------------------
  # Task definitions: app container + CloudWatch agent sidecar
  # ---------------------------------------------------------------------------
  WebTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: dotnet-shop-web
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      RuntimePlatform: { CpuArchitecture: ARM64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: web
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/dotnet-shop/web:${ImageTag}
          Essential: true
          PortMappings:
            - { Name: web, ContainerPort: 8080, AppProtocol: http }
          Environment:
            - { Name: ASPNETCORE_HTTP_PORTS, Value: "8080" }
            - { Name: ShopApi__BaseUrl, Value: http://shop-api:8080 }
            - { Name: Logging__File__Enabled, Value: "false" }
            - { Name: Logging__Console__Json, Value: "true" }
            # --- ADOT .NET auto-instrumentation: switch on the profiler shipped in /app ---
            - { Name: CORECLR_ENABLE_PROFILING, Value: "1" }
            - { Name: CORECLR_PROFILER, Value: "{918728DD-259F-4A6A-AC2B-B85E1B658318}" }
            - { Name: CORECLR_PROFILER_PATH, Value: /app/OpenTelemetry.AutoInstrumentation.Native.so }
            - { Name: DOTNET_STARTUP_HOOKS, Value: /app/OpenTelemetry.AutoInstrumentation.StartupHook.dll }
            - { Name: ASPNETCORE_HOSTINGSTARTUPASSEMBLIES, Value: OpenTelemetry.AutoInstrumentation.AspNetCoreBootstrapper }
            - { Name: OTEL_DOTNET_AUTO_HOME, Value: /app }
            - { Name: OTEL_DOTNET_AUTO_REDIRECT_ENABLED, Value: "false" }
            - { Name: OTEL_DOTNET_AUTO_RULE_ENGINE_ENABLED, Value: "false" }
            - { Name: OTEL_DOTNET_AUTO_LOG_DIRECTORY, Value: /tmp/otel-dotnet-auto }
            # --- What to instrument and how to name it ---
            - { Name: OTEL_SERVICE_NAME, Value: shop-web }
            - Name: OTEL_RESOURCE_ATTRIBUTES
              Value: !Sub deployment.environment=ecs:${Cluster},aws.log.group.names=/dotnet-shop/ecs/web
            - Name: OTEL_DOTNET_AUTO_PLUGINS
              Value: "AWS.Distro.OpenTelemetry.AutoInstrumentation.Plugin, AWS.Distro.OpenTelemetry.AutoInstrumentation:Shop.Telemetry.ShopInstrumentationPlugin, Shop.Telemetry"
            - { Name: OTEL_DOTNET_AUTO_TRACES_ADDITIONAL_SOURCES, Value: "Shop.Web.Simulator" }
            - { Name: OTEL_DOTNET_AUTO_METRICS_ADDITIONAL_SOURCES, Value: "Shop.Web.Simulator" }
            - Name: OTEL_AWS_HTTP_OPERATION_PATHS
              Value: "/Products/Details/{id},/Products,/Cart/Add,/Cart/Remove,/Cart,/Checkout,/Orders/Details/{id},/Orders,/Demo/Run,/Demo/Simulate,/Demo,/Home/Error,/"
            - { Name: OTEL_PROPAGATORS, Value: "tracecontext,baggage" }
            - { Name: OTEL_TRACES_SAMPLER, Value: parentbased_always_on }
            - { Name: OTEL_LOGS_EXPORTER, Value: none }
            # --- Application Signals: spans + RED metrics to the sidecar ---
            - { Name: OTEL_AWS_APPLICATION_SIGNALS_ENABLED, Value: "true" }
            - { Name: OTEL_EXPORTER_OTLP_PROTOCOL, Value: http/protobuf }
            - { Name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, Value: http://127.0.0.1:4316/v1/traces }
            - { Name: OTEL_AWS_APPLICATION_SIGNALS_EXPORTER_ENDPOINT, Value: http://127.0.0.1:4316/v1/metrics }
            # --- Business metrics (shop.*) to the sidecar's plain OTLP receiver -> DotnetShop namespace ---
            - { Name: OTEL_METRICS_EXPORTER, Value: otlp }
            - { Name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT, Value: http://127.0.0.1:4318/v1/metrics }
            - { Name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE, Value: delta }
          DependsOn:
            - { ContainerName: cloudwatch-agent, Condition: START }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WebLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web
        - Name: cloudwatch-agent
          Image: !Ref CloudWatchAgentImage
          Essential: true
          Environment:
            - Name: CW_CONFIG_CONTENT
              Value: '{"traces":{"traces_collected":{"application_signals":{}}},"logs":{"metrics_collected":{"application_signals":{}}},"metrics":{"namespace":"DotnetShop","metrics_collected":{"otlp":{"grpc_endpoint":"127.0.0.1:4317","http_endpoint":"127.0.0.1:4318"}}}}'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AgentLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: dotnet-shop-api
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      RuntimePlatform: { CpuArchitecture: ARM64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/dotnet-shop/api:${ImageTag}
          Essential: true
          PortMappings:
            - { Name: api, ContainerPort: 8080, AppProtocol: http }
          Environment:
            - { Name: ASPNETCORE_HTTP_PORTS, Value: "8080" }
            - { Name: Shop__Aws__OrderQueueUrl, Value: !Ref OrderQueueUrl }
            - { Name: Shop__Integrations__ReceiptsBucket, Value: !Ref ReceiptsBucket }
            - { Name: Shop__Integrations__PaymentSecretId, Value: !Ref PaymentSecretArn }
            - { Name: Logging__File__Enabled, Value: "false" }
            - { Name: Logging__Console__Json, Value: "true" }
            # --- ADOT .NET auto-instrumentation: switch on the profiler shipped in /app ---
            - { Name: CORECLR_ENABLE_PROFILING, Value: "1" }
            - { Name: CORECLR_PROFILER, Value: "{918728DD-259F-4A6A-AC2B-B85E1B658318}" }
            - { Name: CORECLR_PROFILER_PATH, Value: /app/OpenTelemetry.AutoInstrumentation.Native.so }
            - { Name: DOTNET_STARTUP_HOOKS, Value: /app/OpenTelemetry.AutoInstrumentation.StartupHook.dll }
            - { Name: ASPNETCORE_HOSTINGSTARTUPASSEMBLIES, Value: OpenTelemetry.AutoInstrumentation.AspNetCoreBootstrapper }
            - { Name: OTEL_DOTNET_AUTO_HOME, Value: /app }
            - { Name: OTEL_DOTNET_AUTO_REDIRECT_ENABLED, Value: "false" }
            - { Name: OTEL_DOTNET_AUTO_RULE_ENGINE_ENABLED, Value: "false" }
            - { Name: OTEL_DOTNET_AUTO_LOG_DIRECTORY, Value: /tmp/otel-dotnet-auto }
            # --- What to instrument and how to name it ---
            - { Name: OTEL_SERVICE_NAME, Value: shop-api }
            - Name: OTEL_RESOURCE_ATTRIBUTES
              Value: !Sub deployment.environment=ecs:${Cluster},aws.log.group.names=/dotnet-shop/ecs/api
            - Name: OTEL_DOTNET_AUTO_PLUGINS
              Value: "AWS.Distro.OpenTelemetry.AutoInstrumentation.Plugin, AWS.Distro.OpenTelemetry.AutoInstrumentation:Shop.Telemetry.ShopInstrumentationPlugin, Shop.Telemetry"
            - { Name: OTEL_DOTNET_AUTO_TRACES_ADDITIONAL_SOURCES, Value: "Shop.Api,Shop.Demo" }
            - { Name: OTEL_DOTNET_AUTO_METRICS_ADDITIONAL_SOURCES, Value: "Shop.Api,Shop.Demo" }
            - { Name: OTEL_PROPAGATORS, Value: "tracecontext,baggage" }
            - { Name: OTEL_TRACES_SAMPLER, Value: parentbased_always_on }
            - { Name: OTEL_LOGS_EXPORTER, Value: none }
            # --- Application Signals: spans + RED metrics to the sidecar ---
            - { Name: OTEL_AWS_APPLICATION_SIGNALS_ENABLED, Value: "true" }
            - { Name: OTEL_EXPORTER_OTLP_PROTOCOL, Value: http/protobuf }
            - { Name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, Value: http://127.0.0.1:4316/v1/traces }
            - { Name: OTEL_AWS_APPLICATION_SIGNALS_EXPORTER_ENDPOINT, Value: http://127.0.0.1:4316/v1/metrics }
            # --- Business metrics (shop.*) to the sidecar's plain OTLP receiver -> DotnetShop namespace ---
            - { Name: OTEL_METRICS_EXPORTER, Value: otlp }
            - { Name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT, Value: http://127.0.0.1:4318/v1/metrics }
            - { Name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE, Value: delta }
          DependsOn:
            - { ContainerName: cloudwatch-agent, Condition: START }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
        - Name: cloudwatch-agent
          Image: !Ref CloudWatchAgentImage
          Essential: true
          Environment:
            - Name: CW_CONFIG_CONTENT
              Value: '{"traces":{"traces_collected":{"application_signals":{}}},"logs":{"metrics_collected":{"application_signals":{}}},"metrics":{"namespace":"DotnetShop","metrics_collected":{"otlp":{"grpc_endpoint":"127.0.0.1:4317","http_endpoint":"127.0.0.1:4318"}}}}'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AgentLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api

  # ---------------------------------------------------------------------------
  # Services
  # ---------------------------------------------------------------------------
  ApiService:
    Type: AWS::ECS::Service
    # Tasks pull images through the NAT gateway, so wait for the private route.
    DependsOn: [PrivateDefaultRoute, PrivateSubnet1Routes, PrivateSubnet2Routes]
    Properties:
      ServiceName: shop-api
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ApiTaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      DeploymentConfiguration:
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
          SecurityGroups: [!Ref ApiSecurityGroup]
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !GetAtt Namespace.Arn
        Services:
          - PortName: api
            DiscoveryName: shop-api
            ClientAliases:
              - { Port: 8080, DnsName: shop-api }

  WebService:
    Type: AWS::ECS::Service
    DependsOn: [HttpListener, ApiService, PrivateDefaultRoute, PrivateSubnet1Routes, PrivateSubnet2Routes]
    Properties:
      ServiceName: shop-web
      Cluster: !Ref Cluster
      TaskDefinition: !Ref WebTaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
          SecurityGroups: [!Ref WebSecurityGroup]
      LoadBalancers:
        - ContainerName: web
          ContainerPort: 8080
          TargetGroupArn: !Ref WebTargetGroup
      # Client only: shop-web resolves http://shop-api:8080 through Service Connect.
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !GetAtt Namespace.Arn

Outputs:
  StorefrontUrl:
    Description: Reachable only from AllowedCidr
    Value: !Sub http://${Alb.DNSName}
  ClusterName:
    Value: !Ref Cluster
