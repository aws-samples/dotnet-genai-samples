AWSTemplateFormatVersion: "2010-09-09"
Description: Container image repositories for the .NET observability shop (deploy before ecs-fargate.yaml).

Resources:
  WebRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: dotnet-shop/web
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep the last 10 images",
            "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
            "action":{"type":"expire"}}]}

  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: dotnet-shop/api
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep the last 10 images",
            "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
            "action":{"type":"expire"}}]}

Outputs:
  WebRepositoryUri:
    Value: !GetAtt WebRepository.RepositoryUri
  ApiRepositoryUri:
    Value: !GetAtt ApiRepository.RepositoryUri
